# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security) : règles
# Semgrep, onglets sans droit, droits attribuables, traductions, archive, charte, restes après
# désinstallation, secrets (Gitleaks), dépendances (Trivy, Dependency Review), CodeQL, mise à jour
# depuis la version publiée, tests d'intégration en français et parcours de toutes les pages. À rendre obligatoire dans la protection des branches main et dev.
name: Sécurité commune

on:
  # Push : seulement les branches principales ; les branches de travail sont contrôlées par leur PR.
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau commit sur une pull request annule l'exécution précédente de cette PR ; push sur main
# ou dev et lancement manuel : un groupe par exécution (run_id), jamais annulés.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.11.3
    with:
      plugin-key: finops
      # Contrôles lourds (vrai GLPI : onglets et notifications, intégration en français, mise à
      # jour, parcours des pages) seulement si la PR touche autre chose que la documentation ; tout
      # tourne sur les push (main, dev).
      heavy-paths: '* !docs/* !changes/* !*.md !*.png !*.jpg !*.jpeg !*.gif !*.svg !*.webp'
      seed-command: php plugins/finops/tests/security/setup.php
      charter-mode: error
