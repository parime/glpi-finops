name: "💡 Suggestion / Feature request"
description: "Proposer une nouvelle fonctionnalité ou une amélioration · Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ce plugin suit les coûts des ressources cloud et virtualisées, en lecture seule vers les fournisseurs : voir les issues de la feuille de route avant de proposer.
        This plugin follows the costs of cloud and virtualised resources, read-only towards the providers: see the roadmap issues before proposing.

  - type: textarea
    id: problem
    attributes:
      label: "Problème à résoudre · Problem to solve"
      description: "Quel besoin métier ou quelle friction cette suggestion adresse-t-elle ? · What business need or friction does this address?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Solution proposée · Proposed solution"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives envisagées · Alternatives considered"
    validations:
      required: false
